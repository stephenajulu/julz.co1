{{ $project := .project_page }}
<article class="cell project-card">
  <a href="{{ $project.RelPermalink }}" class="project-card__link">
    {{ if $project.Params.thumb_image }}
    <div class="project-card__image">
      <img src="{{ $project.Params.thumb_image | relURL }}" alt="{{ $project.Params.thumb_image_alt | default $project.Params.title }}" loading="lazy" />
    </div>
    {{ end }}
    <header class="project-card__header">
      {{ if $project.Params.category }}
      <div class="project-card__category" style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #542bff; margin-bottom: 0.4rem;">
        {{ $project.Params.category }}
      </div>
      {{ end }}
      <h3 class="project-card__title">{{ $project.Params.title }}</h3>
      {{ if $project.Params.subtitle }}
      <div class="project-card__subtitle">
        {{ $project.Params.subtitle }}
      </div>
      {{ end }}
    </header>
  </a>
</article>
